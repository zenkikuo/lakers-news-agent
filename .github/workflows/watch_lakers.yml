name: Lakers 24H News Monitor

on:
  schedule:
    - cron: '0 * * * *'  # 每小時整點自動執行一次
  workflow_dispatch:     # 允許手動點擊立即測試

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install google-genai openai requests edge-tts pillow beautifulsoup4

      - name: Run Lakers dynamic video monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          python monitor.py 2>&1 | tee error.log

      - name: Commit updated seen_news.json
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen Lakers news" && git push)

      # --- 失敗時自動喚醒 Debug Agent（包含備援金鑰） ---
      - name: Run Auto-Debug Agent on Failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python debug_agent.py

      - name: Create Pull Request with AI Fix
        if: failure()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: auto-patch monitor.py by AI Debug Agent"
          title: "🤖 [Auto-Debug] AI 修復 monitor.py 執行錯誤"
          body-path: pr_body.md
          branch: ai-hotfix/monitor-patch
          delete-branch: true

name: Lakers 24H News Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install google-genai requests edge-tts pillow

      - name: Run Lakers News Monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -o pipefail
          python monitor.py 2>&1 | tee error.log

      - name: Commit updated seen_news.json
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen lakers news" && git push)

      - name: Auto-Fix and Push Directly to Main
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python debug_agent.py
          git config --local user.email "action@github.com"
          git config --local user.name "AI Debug Agent"
          git add monitor.py
          git diff --quiet && git diff --staged --quiet || (git commit -m "fix(auto-heal): patch monitor.py automatically" && git push)
          echo "🔄 重新執行修復後的 monitor.py 驗證..."
          python monitor.py

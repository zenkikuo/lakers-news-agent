name: Lakers 24H News Monitor

on:
  schedule:
    - cron: '0 * * * *'  # 每小時整點自動執行一次
  workflow_dispatch:     # 允許手動點擊立即測試

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Run Lakers news monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Commit updated seen_news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen Lakers news" && git push)
